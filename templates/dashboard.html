<!DOCTYPE html>
<html>
<head>
    <title>Panel de Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f9; }
        
        /* Cajas de Estado */
        .status-container { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;}
        .box { padding: 20px; border-radius: 10px; color: white; min-width: 200px;}
        
        .red { background: #e74c3c; }
        .green { background: #2ecc71; }
        .blue { background: #3498db; }
        .yellow { background: #f1c40f; color: black; }
        .orange { background: #e67e22; animation: blink 0.5s infinite; }
        .grey { background: #95a5a6; }

        @keyframes blink { 50% { opacity: 0.5; } }

        button { padding: 15px 25px; font-size: 16px; margin: 10px; cursor: pointer; border: none; border-radius: 5px; transition: 0.2s; }
        button:hover { opacity: 0.8; }
        
        .btn-open { background: #2ecc71; color: white; }
        .btn-close { background: #e74c3c; color: white; }
        .btn-warn { background: #f39c12; color: white; }
        .btn-info { background: #34495e; color: white; }

        .admin-panel { border-top: 2px solid #ddd; margin-top: 30px; padding-top: 20px; }
        .sensor-active { border: 4px solid #e74c3c; } /* Borde rojo si detecta movimiento */
    </style>
</head>
<body>
    <h1>Panel de Seguridad</h1>
    <p>Usuario: <strong>{{ user }}</strong></p>

    <div class="status-container">
        <div id="door-box" class="box grey">
            <h3>PUERTA</h3>
            <h2 id="door-text">Conectando...</h2>
        </div>

        <div id="sensor-box" class="box grey">
            <h3>SENSOR PIR</h3>
            <h2 id="sensor-text">--</h2>
        </div>

        <div id="mode-box" class="box blue">
            <h3>MODO EMPRESA</h3>
            <h2 id="mode-text">--</h2>
        </div>
    </div>

    <br>
    
    <div class="controls">
        <button class="btn-open" onclick="orden('abrir')">ABRIR PUERTA</button>
        <button class="btn-close" onclick="orden('cerrar')">CERRAR / BLOQUEAR</button>
        <button class="btn-warn" onclick="orden('alarma_off')">SILENCIAR ALARMA</button>
        <br>
        <button class="btn-info" onclick="orden('modo_dia')">MODO DÍA (Abierto)</button>
        <button class="btn-info" onclick="orden('modo_noche')">MODO NOCHE (Cerrado)</button>
    </div>

    {% if es_admin %}
    <div class="admin-panel">
        <h3>Administración</h3>
        <a href="/admin/usuarios"><button class="btn-info">Gestionar Usuarios</button></a>
        <a href="/admin/historial"><button class="btn-info">Ver Historial</button></a>
    </div>
    {% endif %}

    <br><br>
    <a href="/logout" style="color: #7f8c8d;">Cerrar Sesión</a>

    <script>
        function updateState() {
            fetch('/api/estado')
            .then(res => res.json())
            .then(data => {
                const doorBox = document.getElementById('door-box');
                const doorText = document.getElementById('door-text');
                const sensorBox = document.getElementById('sensor-box');
                const modeBox = document.getElementById('mode-box');

                // 1. ESTADO PUERTA
                if (data.estado === 0) {
                    doorBox.className = 'box red';
                    doorText.innerText = "BLOQUEADA";
                } else if (data.estado === 1) {
                    doorBox.className = 'box green';
                    doorText.innerText = "ABIERTA";
                } else if (data.estado === 2) {
                    doorBox.className = 'box orange';
                    doorText.innerText = "¡ALARMA!";
                } else if (data.estado === 3) {
                    doorBox.className = 'box yellow';
                    doorText.innerText = "ESPERANDO CÓDIGO...";
                }

                // 2. ESTADO SENSOR
                if (data.sensor === 1) {
                    sensorBox.className = 'box orange';
                    sensorBox.innerText = "¡MOVIMIENTO!";
                } else {
                    sensorBox.className = 'box grey';
                    sensorBox.innerText = "Quieto";
                }

                // 3. MODO DÍA/NOCHE
                if (data.modo_dia === 1) {
                    modeBox.className = 'box blue';
                    modeBox.innerText = "DÍA (Trabajo)";
                } else {
                    modeBox.className = 'box result'; 
                    modeBox.style.background = "#2c3e50";
                    modeBox.innerText = "NOCHE (Cerrado)";
                }
            });
        }

        function orden(accion) {
            fetch('/api/control/' + accion).then(res => updateState());
        }

        setInterval(updateState, 500); // Actualizar cada 0.5s
    </script>
</body>
</html>
