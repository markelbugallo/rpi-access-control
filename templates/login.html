<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso Seguro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">

    <div class="card login-card">
        <h2>Control de Acceso</h2>
        
        <div class="login-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
        </div>

        <div id="mensaje-error" class="error-msg"></div>

        <form onsubmit="hacerLogin(event)">
            <input type="email" id="email" name="email" placeholder="Usuario / Email" required>
            <input type="password" id="password" name="password" placeholder="Contraseña" required>
            <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
        </form>
    </div>

    <script>
        async function hacerLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('mensaje-error');
            
            errorBox.style.display = 'none';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email: email, password: password })
                });
                const data = await response.json();

                if (data.status === 'ok') {
                    window.location.href = '/index';
                } else {
                    errorBox.innerText = data.message || "Credenciales incorrectas";
                    errorBox.style.display = 'block';
                }
            } catch (e) {
                errorBox.innerText = "Error de conexión";
                errorBox.style.display = 'block';
            }
        }
    </script>
</body>
</html>
